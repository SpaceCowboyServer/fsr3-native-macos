name: build
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write   # the tag release step publishes the dylib
    steps:
      - uses: actions/checkout@v4
      - run: brew install glslang ninja vulkan-loader
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libamd_fidelityfx_vk.dylib
          path: lib/libamd_fidelityfx_vk.dylib
      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: lib/libamd_fidelityfx_vk.dylib
